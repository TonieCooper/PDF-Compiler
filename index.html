<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private PDF Combiner</title><link rel="stylesheet" href="styles.css"></head><body><main><div class="card"><h1>PDF Combiner</h1><p class="sub">Arrange your PDFs, then combine them into one file.</p><div id="drop" class="drop" role="button" tabindex="0"><strong>Drop PDFs here</strong><span>or </span><button type="button">Choose PDF files</button><input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple></div><div class="toolbar"><button id="clear" class="secondary">Clear all</button><div id="summary" class="summary"></div></div><ol id="list"></ol><div class="output"><input id="outName" aria-label="Output filename" value="combined.pdf"><button id="combine">Combine & Download</button></div><div id="status" class="status" aria-live="polite"></div><div class="privacy"><strong>Private:</strong> PDF processing happens in this browser. Your PDF files are not uploaded to a server.</div></div></main><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="app.js"></script></body></html>
